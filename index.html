<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ereğli Lokantası · Menü</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;700&family=Barlow:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#121814; --panel:#1b231d; --panel2:#222c25; --line:#2d3a31; --ink:#f2f0e8; --muted:#a3afa6;
  --green:#2f7a3c; --green-deep:#296132; --on-green:#fff; --gold:#e8c96a;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: light){
  :root:not([data-theme="dark"]){
    --bg:#f3f1e9; --panel:#fffdf7; --panel2:#f7f4ea; --line:#dedacb; --ink:#1c231e; --muted:#5d675f;
    --green:#296132; --green-deep:#1f4c27; --gold:#8a6400;
  }
}
:root[data-theme="light"]{
  --bg:#f3f1e9; --panel:#fffdf7; --panel2:#f7f4ea; --line:#dedacb; --ink:#1c231e; --muted:#5d675f;
  --green:#296132; --green-deep:#1f4c27; --gold:#8a6400;
}
*,*::before,*::after{box-sizing:inherit}
html{height:100%}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:Barlow,"Segoe UI",Roboto,Arial,sans-serif;font-size:17px;line-height:1.4;-webkit-font-smoothing:antialiased}
img{max-width:100%;display:block}
button{font:inherit;color:inherit}
a,button{-webkit-tap-highlight-color:transparent}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.wrap{max-width:620px;margin:0 auto;padding:0 16px}
.h{font-family:Oswald,"Arial Narrow",Impact,sans-serif;font-weight:700;letter-spacing:.01em}

/* ---------- ANA SAYFA ---------- */
.cover{background:linear-gradient(180deg,var(--green-deep),var(--bg));padding:26px 0 8px;text-align:center}
.cover img{width:112px;height:112px;margin:0 auto;border-radius:50%;box-shadow:0 8px 28px rgba(0,0,0,.35)}
.cover h1{margin:12px 0 2px;font-size:30px}
.cover p{margin:0;color:var(--muted);font-size:15px}
.info{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;margin:16px 0 4px}
.pill{display:inline-flex;align-items:center;gap:7px;text-decoration:none;color:var(--ink);background:var(--panel);border:1px solid var(--line);padding:8px 13px;border-radius:999px;font-weight:600;font-size:14.5px;min-height:40px}
.pill.go{background:var(--green);border-color:var(--green);color:var(--on-green)}
.pill svg{width:17px;height:17px;flex:0 0 auto}

.sec-title{font-size:22px;margin:24px 0 12px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.card{position:relative;border:0;padding:0;border-radius:18px;overflow:hidden;cursor:pointer;aspect-ratio:1/1;background:var(--panel);text-align:left}
.card img{width:100%;height:100%;object-fit:cover;transition:transform .35s ease}
.card:hover img{transform:scale(1.05)}
.card::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,0) 40%,rgba(0,0,0,.78))}
.card span{position:absolute;left:12px;right:12px;bottom:11px;z-index:1;color:#fff;font-family:Oswald,"Arial Narrow",sans-serif;font-weight:700;font-size:20px;line-height:1.1;text-shadow:0 1px 3px rgba(0,0,0,.5)}
.card small{display:block;font-family:Barlow,sans-serif;font-weight:500;font-size:13px;opacity:.85;margin-top:3px}

/* ---------- KATEGORİ SAYFASI ---------- */
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:10;background:var(--bg);border-bottom:1px solid var(--line)}
.topbar .row1{display:flex;align-items:center;gap:10px;padding-top:10px;padding-bottom:8px}
.back{width:42px;height:42px;border-radius:12px;border:1px solid var(--line);background:var(--panel);display:grid;place-items:center;cursor:pointer;flex:0 0 auto}
.back svg{width:22px;height:22px}
.topbar h2{margin:0;font-size:22px;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chips{position:relative;display:flex;gap:8px;overflow-x:auto;padding-bottom:10px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;border:0;background:var(--panel2);color:var(--ink);padding:8px 14px;border-radius:999px;font-weight:600;font-size:14.5px;cursor:pointer;white-space:nowrap}
.chip.on{background:var(--green);color:var(--on-green)}

.banner{position:relative;border-radius:18px;overflow:hidden;margin:14px 0 16px;height:150px}
.banner img{width:100%;height:100%;object-fit:cover;filter:saturate(1.05)}
.banner::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(0,0,0,.72),rgba(0,0,0,.05) 70%)}
.banner div{position:absolute;left:16px;bottom:14px;z-index:1;color:#fff}
.banner b{display:block;font-family:Oswald,"Arial Narrow",sans-serif;font-size:28px;line-height:1}
.banner em{font-style:normal;font-size:14px;opacity:.85}

.items{display:grid;gap:10px;padding-bottom:28px}
.item{display:flex;gap:12px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:10px}
.item .ph{width:84px;height:84px;border-radius:12px;object-fit:cover;flex:0 0 84px}
.item .art{overflow:hidden;background:#1c1916}
.item .art svg{width:100%;height:100%;display:block}
.item .noph{width:84px;height:84px;border-radius:12px;flex:0 0 84px;display:grid;place-items:center;background:var(--panel2);color:var(--muted)}
.item .noph svg{width:34px;height:34px;opacity:.7}
.item .body{flex:1;min-width:0;padding-right:4px}
.item h3{margin:0 0 7px;font-size:17px;font-weight:700;line-height:1.2}
.tag{display:inline-block;font-size:11.5px;font-weight:700;color:var(--gold);border:1px solid currentColor;border-radius:6px;padding:1px 6px;margin-bottom:6px}
.prices{display:flex;flex-wrap:wrap;gap:6px}
.pr{display:inline-flex;align-items:baseline;gap:6px;background:var(--panel2);border-radius:9px;padding:5px 9px;font-variant-numeric:tabular-nums}
.pr small{color:var(--muted);font-size:12.5px;font-weight:600}
.pr b{font-size:16.5px}
.pr.main{background:var(--green);color:var(--on-green)}
.pr.main small{color:inherit;opacity:.85}
.ask{color:var(--muted);font-size:14.5px}

footer{margin-top:30px;padding:24px 0 30px;background:var(--panel);border-top:5px solid var(--green)}
footer .h{font-size:22px;margin:0 0 10px}
footer p{margin:4px 0;color:var(--muted);font-size:15px}
.end{color:var(--muted);font-size:13px;text-align:center;margin-top:18px}
[hidden]{display:none!important}
.fade{animation:fade .25s ease}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.fade{animation:none}.card img{transition:none}}
</style>
</head>
<body>

<!-- ANA SAYFA -->
<div id="home">
  <header class="cover">
    <div class="wrap">
      <img id="logo" alt="Ereğli Lokantası logosu" width="112" height="112">
      <h1 class="h">Ereğli Lokantası</h1>
      <p>Ev yemekleri · Çorbalar · Döner</p>
      <div class="info" id="info"></div>
    </div>
  </header>
  <main class="wrap">
    <h2 class="h sec-title">Menü</h2>
    <div class="grid" id="grid"></div>
  </main>
  <footer>
    <div class="wrap">
      <h2 class="h">Bize ulaşın</h2>
      <p id="fAddr"></p>
      <p id="fTel"></p>
      <p class="end">Afiyet olsun.</p>
    </div>
  </footer>
</div>

<!-- KATEGORİ SAYFASI -->
<div id="cat" hidden>
  <div class="topbar">
    <div class="wrap">
      <div class="row1">
        <button class="back" id="back" aria-label="Ana menüye dön">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
        </button>
        <h2 class="h" id="catTitle"></h2>
      </div>
      <div class="chips" id="chips"></div>
    </div>
  </div>
  <main class="wrap" id="catBody"></main>
</div>

/* ==== MENÜ ====  [ad, porsiyon, az, görsel, not]  az: null → yok */
const MENU = [
  { id:"corbalar", title:"Çorbalar", img:"corba", items:[
    ["İşkembe – Paça Çorbası",170,90,"corba"],
    ["Tavuk Çorbası",110,70,"tavukcorba"],
    ["Mercimek Çorbası",90,60,"mercimek"],
    ["Şehriye Çorbası",90,60,"sehriye"]
  ]},
  { id:"et", title:"Et Yemekleri", img:"doner", items:[
    ["Pilav Üstü Et Döner",420,230,"doner","Ustanın önerisi"],
    ["Et Döner",370,190,"etdoner"],
    ["Sulu Et Yemekleri",350,180,"suluet"],
    ["Ciğer",330,170,"ciger"],
    ["Köfte Yemekleri",330,170,"kofte"],
    ["Tavuk Yemekleri",220,120,"tavukyemek"]
  ]},
  { id:"sulu", title:"Sulu Yemekler", img:"sebze", items:[
    ["Sebze Yemekleri",150,80,"sebze"],
    ["Bakliyat Yemekleri",150,80,"bakliyat"],
    ["Pilav",100,60,"pilav"]
  ]},
  { id:"kiymali", title:"Kıymalılar", img:"karniyarik", items:[
    ["Karnıyarık",180,100,"karniyarik"],
    ["Patlıcan Musakka",180,null,"musakka"],
    ["Biber Dolması",180,100,"dolma"]
  ]},
  { id:"tatli", title:"Tatlılar", img:"sutlac", items:[
    ["Fırında Sütlaç",120,null,"sutlac"],
    ["Ekmek Tatlısı – Kadayıf",120,null,"ekmektatli"],
    ["Kaymaklılar",150,null,"kaymakli"]
  ]},
  { id:"meze", title:"Meze ve Salatalar", img:"cacik", items:[
    ["Cacık",70,50,"cacik"],
    ["Yoğurt",70,50,"yogurt"],
    ["Komposto",70,50,"komposto"],
    ["Salata","ask","ask","salata"]
  ]}
];

const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
const ico = {
  tel:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1 1 .4 1.9.7 2.8a2 2 0 0 1-.5 2.1L8 9.9a16 16 0 0 0 6 6l1.3-1.3a2 2 0 0 1 2.1-.4c.9.3 1.8.6 2.8.7a2 2 0 0 1 1.7 2z"/></svg>',
  ig:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.5" cy="6.5" r="1" fill="currentColor"/></svg>',
  map:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 21s-7-6.2-7-11.5a7 7 0 0 1 14 0C19 14.8 12 21 12 21z"/><circle cx="12" cy="9.5" r="2.5"/></svg>',
  dish:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M3 17h18M5 17a7 7 0 0 1 14 0M12 10V8.5M10.5 8.5h3"/><path d="M4 20h16"/></svg>'
};

/* ---- ana sayfa ---- */
$('logo').src = IMG.logo;
$('info').innerHTML = `
  <a class="pill go" href="tel:${INFO.phoneRaw}">${ico.tel}Paket servis · ${INFO.phone}</a>
  <a class="pill" href="https://instagram.com/${INFO.instagram}" target="_blank" rel="noopener">${ico.ig}Instagram</a>
  <a class="pill" href="${INFO.mapsUrl}" target="_blank" rel="noopener">${ico.map}Yol tarifi</a>`;
$('fAddr').textContent = INFO.address;
$('fTel').innerHTML = `Paket servis: <a href="tel:${INFO.phoneRaw}" style="color:inherit">${INFO.phone}</a>`;

$('grid').innerHTML = MENU.map((c,i) => `
  <button class="card" data-i="${i}" aria-label="${esc(c.title)}">
    <img src="${IMG[c.img]}" alt="" loading="lazy">
    <span>${esc(c.title)}<small>${c.items.length} ürün</small></span>
  </button>`).join('');
$('grid').addEventListener('click', e => {
  const b = e.target.closest('.card'); if (b) openCat(+b.dataset.i, true);
});

/* ---- kategori ---- */
$('chips').innerHTML = MENU.map((c,i)=>`<button class="chip" data-i="${i}">${esc(c.title)}</button>`).join('');
$('chips').addEventListener('click', e => {
  const b = e.target.closest('.chip'); if (b) openCat(+b.dataset.i, false);
});

const price = (label, v, main) => v === null ? '' :
  `<span class="pr${main?' main':''}"><small>${label}</small><b>${v} TL</b></span>`;

function renderItems(c){
  return c.items.map(([n,p,a,img,note]) => `
    <article class="item">
      ${IMG[img] ? `<img class="ph" src="${IMG[img]}" alt="${esc(n)}" loading="lazy">` : ART[img] ? `<div class="ph art" role="img" aria-label="${esc(n)}">${ART[img]}</div>` : `<div class="noph" aria-hidden="true">${ico.dish}</div>`}
      <div class="body">
        ${note ? `<span class="tag">${esc(note)}</span>` : ''}
        <h3>${esc(n)}</h3>
        ${p === "ask" ? `<span class="ask">Fiyat için sorunuz</span>` :
          `<div class="prices">${price('Porsiyon',p,true)}${price('Az',a,false)}</div>`}
      </div>
    </article>`).join('');
}

let current = -1;
function openCat(i, push){
  const c = MENU[i]; current = i;
  $('catTitle').textContent = c.title;
  $('catBody').innerHTML = `
    <div class="banner fade"><img src="${IMG[c.img]}" alt=""><div><b>${esc(c.title)}</b><em>${c.items.length} ürün</em></div></div>
    <div class="items fade">${renderItems(c)}</div>`;
  [...$('chips').children].forEach((ch,j)=>ch.classList.toggle('on', j===i));
  const on = $('chips').children[i], bar = $('chips');
  bar.scrollTo({left: on.offsetLeft - (bar.clientWidth - on.offsetWidth)/2, behavior: reduce?'auto':'smooth'});
  $('home').hidden = true; $('cat').hidden = false;
  window.scrollTo(0,0);
  if (push) { try { history.pushState({cat:i}, ''); } catch(e){} }
}
function goHome(){
  $('cat').hidden = true; $('home').hidden = false; current = -1;
  window.scrollTo(0,0);
}
$('back').addEventListener('click', () => {
  if (history.state && history.state.cat !== undefined) { try { history.back(); return; } catch(e){} }
  goHome();
});
window.addEventListener('popstate', e => {
  if (e.state && e.state.cat !== undefined) openCat(e.state.cat, false); else goHome();
});
</script>
</body>
</html>
