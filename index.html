<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ereğli Lokantası · Menü</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;700&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#141a16; --panel:#1c241e; --line:#2e3a31; --ink:#f1efe6; --muted:#a8b3aa;
  --red:#2f7a3c; --red-ink:#fff; --gold:#e8c96a; --chip:#243029;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: light){
  :root:not([data-theme="dark"]){
    --bg:#f4f1e8; --panel:#fffdf7; --line:#dcd8c8; --ink:#1d241f; --muted:#5e685f;
    --red:#296132; --red-ink:#fff; --gold:#8a6400; --chip:#e6e8dc;
  }
}
:root[data-theme="light"]{
  --bg:#f4f1e8; --panel:#fffdf7; --line:#dcd8c8; --ink:#1d241f; --muted:#5e685f;
    --red:#296132; --red-ink:#fff; --gold:#8a6400; --chip:#e6e8dc;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 64px)}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Barlow,"Segoe UI",Roboto,Arial,sans-serif;font-size:17px;line-height:1.45;-webkit-font-smoothing:antialiased}
.wrap{max-width:560px;margin:0 auto;padding:0 16px}

header.hero{padding:28px 0 18px;text-align:center}
.brand{font-family:Oswald,"Arial Narrow",Impact,sans-serif;font-weight:700;letter-spacing:.01em;line-height:.95;margin:0;font-size:clamp(44px,14vw,68px)}
.logo{display:block;margin:0 auto;width:130px;height:130px}
.brand span{display:block;font-size:.52em;font-weight:500;color:var(--muted);letter-spacing:.18em;margin-top:6px}
.stripe{height:6px;background:repeating-linear-gradient(90deg,var(--red) 0 22px,transparent 22px 30px);margin:18px auto 0;max-width:220px;border-radius:3px}
.pkt{display:inline-block;margin-top:12px;padding:7px 14px;border-radius:999px;border:1.5px solid var(--red);color:var(--ink);text-decoration:none;font-weight:600;font-size:15px}
.pkt:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.hint{color:var(--muted);font-size:14px;margin:14px 0 0}

nav.cats{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
nav.cats .wrap{position:relative;display:flex;gap:8px;overflow-x:auto;padding-top:10px;padding-bottom:10px;scrollbar-width:none}
nav.cats .wrap::-webkit-scrollbar{display:none}
nav.cats a{flex:0 0 auto;text-decoration:none;color:var(--ink);background:var(--chip);padding:8px 14px;border-radius:999px;font-weight:600;font-size:15px;white-space:nowrap}
nav.cats a.on{background:var(--red);color:var(--red-ink)}
nav.cats a:focus-visible,.btn:focus-visible{outline:3px solid var(--gold);outline-offset:2px}

section.cat{padding:26px 0 6px}
.head{display:flex;align-items:center;gap:14px;margin:0 0 12px}
.thumb{width:68px;height:68px;flex:0 0 68px;border-radius:50%;object-fit:cover;border:3px solid var(--red);background:var(--panel)}
.head h2{flex:1;margin:0!important}
.cat h2{font-family:Oswald,"Arial Narrow",Impact,sans-serif;font-weight:700;font-size:28px;margin:0 0 10px;display:flex;align-items:baseline;justify-content:space-between;gap:12px}
.cols{display:flex;gap:0;font-family:Barlow,sans-serif;font-size:13px;font-weight:600;color:var(--muted)}
.cols b,.price{width:68px;text-align:right;font-weight:600}
.list{background:var(--panel);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.row{display:flex;align-items:center;gap:8px;padding:14px 14px;border-top:1px solid var(--line)}
.row:first-child{border-top:0}
.name{flex:1;font-weight:500}
.price{font-variant-numeric:tabular-nums;font-size:17px}
.price.az{color:var(--muted);font-weight:500}
.dash{color:var(--muted);opacity:.6}
.row.fav{background:linear-gradient(90deg,color-mix(in srgb,var(--red) 16%,transparent),transparent 80%)}
.tag{display:inline-block;margin-left:6px;font-size:12px;font-weight:600;color:var(--gold);border:1px solid currentColor;border-radius:6px;padding:1px 6px;vertical-align:2px}
.ask{color:var(--muted);font-size:14px;text-align:right}
.note{color:var(--muted);font-size:14px;margin:14px 2px 0}

footer.contact{margin-top:34px;padding:28px 0 36px;border-top:6px solid var(--red);background:var(--panel)}
footer h2{font-family:Oswald,"Arial Narrow",Impact,sans-serif;font-size:26px;margin:0 0 14px}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;text-decoration:none;font-weight:600;padding:14px 10px;border-radius:12px;background:var(--chip);color:var(--ink);border:1px solid var(--line);min-height:52px}
.btn.primary{background:var(--red);color:var(--red-ink);border-color:var(--red);grid-column:1 / -1;font-size:18px}
.btn svg{width:20px;height:20px;flex:0 0 auto}
dl{margin:20px 0 0;display:grid;grid-template-columns:auto 1fr;gap:8px 14px;font-size:16px}
dt{color:var(--muted)}
dd{margin:0}
.copy{color:var(--muted);font-size:13px;text-align:center;margin-top:26px}
</style>
</head>

/* ==== MENÜ ==== (az: null → az porsiyon yok) */
const MENU = [
  { id:"corbalar", title:"Çorbalar", items:[
    ["İşkembe – Paça Çorbası",170,90],
    ["Tavuk Çorbası",110,70],
    ["Mercimek Çorbası",90,60],
    ["Şehriye Çorbası",90,60]
  ]},
  { id:"et", title:"Et Yemekleri", items:[
    ["Sulu Et Yemekleri",350,180],
    ["Et Döner",370,190],
    ["Pilav Üstü Et Döner",420,230,"fav"],
    ["Ciğer",330,170],
    ["Köfte Yemekleri",330,170],
    ["Tavuk Yemekleri",220,120]
  ]},
  { id:"sulu", title:"Sulu Yemekler", items:[
    ["Pilav",100,60],
    ["Sebze Yemekleri",150,80],
    ["Bakliyat Yemekleri",150,80]
  ]},
  { id:"kiymali", title:"Kıymalılar", items:[
    ["Patlıcan Musakka",180,null],
    ["Karnıyarık",180,100],
    ["Biber Dolması",180,100]
  ]},
  { id:"tatli", title:"Tatlılar", items:[
    ["Fırında Sütlaç",120,null],
    ["Ekmek Tatlısı – Kadayıf",120,null],
    ["Kaymaklılar",150,null]
  ]},
  { id:"soguk", title:"Soğuk İçecekler", items:[
    ["Cacık – Yoğurt – Komposto",70,50],
    ["Salata","ask","ask"]
  ]}
];

const fmt = v => v === null ? '<span class="dash" aria-label="yok">—</span>'
  : v === "ask" ? '' : v + ' TL';

const nav = document.getElementById('nav');
const main = document.getElementById('menu');

MENU.forEach(c => {
  nav.insertAdjacentHTML('beforeend', `<a href="#${c.id}">${c.title}</a>`);
  const rows = c.items.map(([n,p,a,flag]) => {
    if (p === "ask") return `<div class="row"><span class="name">${n}</span><span class="ask">Fiyat için sorunuz</span></div>`;
    return `<div class="row${flag==='fav'?' fav':''}">
      <span class="name">${n}${flag==='fav'?'<span class="tag">Ustanın önerisi</span>':''}</span>
      <span class="price">${fmt(p)}</span><span class="price az">${fmt(a)}</span></div>`;
  }).join('');
  main.insertAdjacentHTML('beforeend', `
    <section class="cat" id="${c.id}">
      <div class="head"><img class="thumb" src="${IMG[c.id]}" alt="" width="68" height="68"><h2>${c.title}<span class="cols"><b>Porsiyon</b><b>Az</b></span></h2></div>
      <div class="list">${rows}</div>
    </section>`);
});
nav.insertAdjacentHTML('beforeend', `<a href="#iletisim">İletişim</a>`);
main.insertAdjacentHTML('beforeend', `<p class="note">Günün yemekleri için personelimize danışabilirsiniz.</p>`);

/* iletişim */
document.getElementById('callBtn').href = 'tel:' + INFO.phoneRaw;
document.getElementById('callLabel').textContent = 'Paket servis · ' + INFO.phone;
document.getElementById('igBtn').href = 'https://instagram.com/' + INFO.instagram;
document.getElementById('mapBtn').href = INFO.mapsUrl;
const hideIfEmpty=(id,v)=>{const dd=document.getElementById(id);if(v){dd.textContent=v}else{dd.previousElementSibling.remove();dd.remove()}};
hideIfEmpty('addr',INFO.address);
hideIfEmpty('hours',INFO.hours);

/* kategori butonları: JS ile kaydır (hash linkleri bazı görüntüleyicilerde çalışmıyor) */
const links = [...nav.querySelectorAll('a')];
const targets = links.map(l => document.getElementById(l.getAttribute('href').slice(1)));
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
let lock = 0;
function setActive(i){
  links.forEach((l,j) => l.classList.toggle('on', j === i));
  const chip = links[i], bar = nav;            // sadece yatay çubuğu kaydır, sayfayı değil
  const left = chip.offsetLeft - (bar.clientWidth - chip.offsetWidth) / 2;
  bar.scrollTo({left, behavior: reduce ? 'auto' : 'smooth'});
}
links.forEach((l,i) => l.addEventListener('click', e => {
  e.preventDefault();
  const t = targets[i]; if (!t) return;
  const navH = document.querySelector('nav.cats').offsetHeight;
  const top = t.getBoundingClientRect().top + window.scrollY - navH - 8;
  lock = Date.now() + 900;
  setActive(i);
  window.scrollTo({top, behavior: reduce ? 'auto' : 'smooth'});
}));
function onScroll(){
  if (Date.now() < lock) return;
  const navH = document.querySelector('nav.cats').offsetHeight + 20;
  let cur = 0;
  targets.forEach((t,i) => { if (t && t.getBoundingClientRect().top - navH <= 0) cur = i; });
  if ((window.innerHeight + window.scrollY) >= document.documentElement.scrollHeight - 4) cur = targets.length - 1;
  if (!links[cur].classList.contains('on')) setActive(cur);
}
window.addEventListener('scroll', onScroll, {passive:true});
onScroll();
</script>
